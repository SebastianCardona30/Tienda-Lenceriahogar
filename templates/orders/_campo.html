{# Renderiza un campo del checkout con su etiqueta, ayuda y errores. #}
<div class="campo {% if campo.errors %}campo--error{% endif %}"
     {% if campo.errors %}data-con-error="1"{% endif %}>
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="campo__casilla" for="{{ campo.id_for_label }}">
      {{ campo }} <span>{{ campo.label }}</span>
    </label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <abbr title="obligatorio">*</abbr>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<small class="campo__ayuda">{{ campo.help_text }}</small>{% endif %}
  {% for error in campo.errors %}<small class="campo__error" role="alert">{{ error }}</small>{% endfor %}
</div>
